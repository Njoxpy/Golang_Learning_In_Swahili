site_name: Golang Learning in Swahili
site_description: "Golang Learning resources, lessons, and exercises in Swahili"
site_author: "Njox Lee"
site_url: "https://github.com/Njoxpy/Golang_Learning_In_Swahili"

repo_name: "Njoxpy/Golang_Learning_In_Swahili"
repo_url: "https://github.com/Njoxpy/Golang_Learning_In_Swahili"
edit_uri: "edit/main/docs/"

theme:
  name: material
  language: en
  features:
    - navigation.expand
    - navigation.top
    - navigation.sections
    - toc.integrate
    - content.code.copy
    - content.action.edit # GitHub edit button
    - content.tabs.link
    - content.footnotes
    - search.suggest
    - search.highlight
  palette:
    scheme: default
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md

  - Lessons:
      - Beginner:
          - Introduction: lessons/beginner/introduction.md
          - Variables & Types: lessons/beginner/variables_and_types.md
          - Assignment & Expressions: lessons/beginner/assignment_expression.md
          - Operators: lessons/beginner/operators.md
          - Control Flow: lessons/beginner/control_flow.md
          - Functions: lessons/beginner/functions.md
          - Error Handling: lessons/beginner/error_handling.md
          - Packages: lessons/beginner/packages.md
          - Arrays & Slices: lessons/beginner/arrays_slices.md
          - Maps: lessons/beginner/maps.md
          - Structs: lessons/beginner/structs.md

      - Intermediate:
          - Pointers: lessons/intermediate/pointers.md
          - Interfaces: lessons/intermediate/interfaces.md
          - Concurrency: lessons/intermediate/concurrency.md
          - Channels: lessons/intermediate/channels.md
          - File I/O: lessons/intermediate/file_io.md
          - Testing: lessons/intermediate/testing.md

      - Advanced:
          - Context: lessons/advanced/context.md
          - Concurrency Patterns: lessons/advanced/concurrency_patterns.md
          - Dependency Management: lessons/advanced/dependency_management.md
          - Reflection: lessons/advanced/reflection.md
          - Performance Tuning: lessons/advanced/performance_tuning.md
          - Optimization Techniques: lessons/advanced/optimization_techniques.md

  - Exercises:
      - Beginner:
          - Questions: exercises/beginner/beginner_questions.md
          - Exercise 1: exercises/beginner/exercise1.go
          - Exercise 2: exercises/beginner/exercise2.go

      - Intermediate:
          - Questions: exercises/intermediate/intermediate_questions.md
          - Exercise 1: exercises/intermediate/exercise1.go
          - Exercise 2: exercises/intermediate/exercise2.go

      - Advanced:
          - Questions: exercises/advanced/advanced_questions.md
          - Exercise 1: exercises/advanced/exercise1.go
          - Exercise 2: exercises/advanced/exercise2.go

  - Questions:
      - Common Questions: lessons/questions/questions.md

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.highlight
  - pymdownx.emoji
  - pymdownx.magiclink # auto-convert URLs to clickable links
  - pymdownx.keys

plugins:
  - search
